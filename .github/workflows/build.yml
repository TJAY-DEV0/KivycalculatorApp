name: Build Android APK (Docker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Pull Buildozer Docker image
        run: |
          docker pull kivy/buildozer:latest

      - name: Verify image
        run: |
          docker images
