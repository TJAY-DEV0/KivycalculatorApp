name: Build on Commit (as Artifact)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}

    - name: Decode Keystore secret to file
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > new-release-key.jks

    - name: Fix permissions before build
      run: |
        sudo chown -R $USER:$USER $GITHUB_WORKSPACE

    - name: Build with Buildozer for release
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android release
        buildozer_version: stable
      env:
        KEYSTORE_PATH: new-release-key.jks
        KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KivyCalculatorApp-release-build
        path: ${{ steps.buildozer.outputs.filename }}