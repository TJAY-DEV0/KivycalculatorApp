name: Build Android APK (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Pull Docker image
        run: docker pull kivy/buildozer:latest

      - name: Check Buildozer version
        run: |
          docker run --rm kivy/buildozer sh -c "echo y | buildozer --version"
