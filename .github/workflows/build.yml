name: Build Kivy App (Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libssl-dev libffi-dev libpython3-dev git zip unzip openjdk-17-jdk
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > my-release-key.jks

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true
          yes | sdkmanager --update || true

      - name: Build release APK
        run: buildozer android release

      - name: Move and upload APK
        run: |
          mkdir -p output
          mv bin/*.apk output/KivyCalculator-v1.0.apk
        shell: bash

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KivyCalculator-v1.0
          path: output/KivyCalculator-v1.0.apk