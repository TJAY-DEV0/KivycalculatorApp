name: Android CI Buildozer
on: [push, pull_request]

jobs:
  build_debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build with Buildozer for Android Debug
        # Use the fixed version of the action
        uses: ArtemSBulgakov/buildozer-action@v1.2.0
        with:
          # Use the 'command' input instead of 'buildozer-cmd'
          command: "buildozer android debug"
