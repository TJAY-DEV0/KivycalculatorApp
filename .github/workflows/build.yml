name: Build and Release Android App

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when a tag starting with 'v' is pushed (e.g., v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}

    - name: Decode Keystore secret to file
      run: |
        # Decodes the Base64 secret into your specified filename
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > new-release-key.jks

    - name: Build with Buildozer for release
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android release
        buildozer_version: stable
      env:
        # Pass the path to the decoded keystore file and your other secrets
        KEYSTORE_PATH: new-release-key.jks # <-- Updated filename here
        KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.buildozer.outputs.filename }}
        asset_name: KivycalculatorApp-${{ github.ref_name }}.${{ steps.buildozer.outputs.filename_extension }}
        asset_content_type: application/vnd.android.package-archive
