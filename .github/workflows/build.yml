name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python and Java
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openjdk-17-jdk zlib1g-dev unzip
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Add 4GB Swap (Prevent Memory Errors)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Patch buildozer.spec for Release APK
        run: |
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/#android.api =.*/android.api = 33/g' buildozer.spec
          sed -i 's/#android.build_tools_version =.*/android.build_tools_version = 34.0.0/g' buildozer.spec
          echo "android.release_artifact = apk" >> buildozer.spec

      - name: Build Release APK
        env:
          KEYSTORE_PATH: new-release-key.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "🏗️ Building signed release APK..."
          buildozer -v android release || true
          echo "🔧 Forcing Gradle to assembleRelease instead of bundleRelease..."
          cd .buildozer/android/platform/build-*/*/ && ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KivyCalculator-Release
          path: bin/*.apk