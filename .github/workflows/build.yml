name: Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python and Java 17
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openjdk-17-jdk zlib1g-dev unzip
          pip install --upgrade pip
          pip install buildozer cython

      - name: 🧠 Add 4GB Swap Space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Fix p4a branch and settings
        run: |
          sed -i 's/#p4a.branch = master/p4a.branch = develop/g' buildozer.spec
          sed -i 's/p4a.branch = main/p4a.branch = develop/g' buildozer.spec
          sed -i 's/#android.build_tools_version =.*/android.build_tools_version = 34.0.0/g' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/android.accept_sdk_license = True\./android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/#android.api = 31/android.api = 33/g' buildozer.spec

      - name: ✅ Pre-accept Android SDK licenses
        run: |
          yes | buildozer android update || true

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: new-release-key.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          export JAVA_HOME=$JAVA_HOME_17_X64
          ls -lh
          echo "🔐 Using keystore: $KEYSTORE_PATH"
          buildozer -v android release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KivyCalculator-Release
          path: bin/*.apk