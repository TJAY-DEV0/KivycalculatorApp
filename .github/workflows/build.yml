name: Buildozer Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # we install both so builds targeting 31 or 33 work
  ANDROID_API_LIST: "platforms;android-31 platforms;android-33"
  BUILD_TOOLS_LIST: "build-tools;31.0.0 build-tools;33.0.0"
  CMDLINE_TOOLS: "cmdline-tools;latest"
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OS packages (apt) and tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git unzip openjdk-17-jdk-headless zlib1g-dev libffi-dev libssl-dev \
            autoconf automake libtool pkg-config build-essential liblz4-tool \
            python3-venv python3-distutils curl
        # If any package fails, the step will fail — these are the usual buildozer deps.

      - name: Set up Android SDK (cmdline-tools, platforms, build-tools)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          # Install cmdline tools
          cd "${ANDROID_SDK_ROOT}"
          # fetch sdkmanager (via commandline-tools)
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-114324_https.zip -o /tmp/cmdline.zip || true
          unzip -o /tmp/cmdline.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest" 2>/dev/null || true
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          # install platforms & build-tools we need (non-interactive)
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" ${CMDLINE_TOOLS} ${ANDROID_API_LIST} ${BUILD_TOOLS_LIST} "platform-tools" || true
          # try to install a common NDK if missing (p4a/buildozer may download its own)
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "ndk;25.2.9519653" || true
          # show what we have
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --list

      - name: Create python venv & install Buildozer + deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          # pinned/safe installs:
          pip install "buildozer==1.5.0" cython
          # If you use python-for-android locally, it will be pulled automatically by buildozer

      - name: Create release keystore from secret
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # decode keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
          ls -l release-key.jks

      - name: Add swap (best-effort for heavy builds)
        run: |
          # Try fallocate, if it fails fall back to dd. Best-effort; runner may not allow.
          SWAPFILE=/swapfile
          if sudo fallocate -l 4G "$SWAPFILE" 2>/dev/null; then
            echo "fallocate ok"
          else
            echo "fallocate failed, trying dd"
            sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=4096 || true
          fi
          sudo chmod 600 "$SWAPFILE" || true
          sudo mkswap "$SWAPFILE" || true
          sudo swapon "$SWAPFILE" || true
          free -h || true

      - name: Prepare buildozer config (copy keystore values into env)
        env:
          KEYSTORE_PATH: release-key.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Export env for buildozer usage
          echo "KEYSTORE_PATH=${KEYSTORE_PATH:-release-key.jks}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
          # show the buildozer.spec android.api (for debugging)
          if [ -f buildozer.spec ]; then
            grep -E '^(android.api|android.minapi|android.arch|android.accept_sdk_license)' buildozer.spec || true
          fi

      - name: Cache .buildozer and python packages
        uses: actions/cache@v4
        with:
          path: |
            ./.buildozer
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-cache-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            buildozer-cache-${{ runner.os }}-

      - name: Run Buildozer (release) — try bundle then fallback to assemble
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDNDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
          ANDROIDAPI: "31"
          ANDROIDMINAPI: "21"
          ANDROIDSDKROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          PATH: ${{ env.ANDROID_SDK_ROOT }}/platform-tools:${{ env.PATH }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          # ensure buildozer uses the right SDK root
          export ANDROIDSDK=$ANDROIDSDK
          export ANDROIDNDK=$ANDROIDNDK
          export ANDROIDAPI=${ANDROIDAPI}
          export ANDROIDMINAPI=${ANDROIDMINAPI}
          # show some debug info
          python -V
          buildozer --version || true
          echo "ANDROIDSDK: $ANDROIDSDK"
          echo "ANDROIDNDK: $ANDROIDNDK"
          echo "JAVA_HOME: $JAVA_HOME"
          # Run buildozer; if bundle fails, try assembleRelease
          set +e
          buildozer -v android release || true
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "bundleRelease buildozer step failed (exit $rc). Trying assembleRelease fallback..."
            # Force Gradle assembleRelease instead of bundleRelease by editing local gradle wrapper cmd in p4a distr dir
            # Attempt a safer fallback: re-run buildozer aab/gradle assemble
            buildozer -v android release deploy || true
            # if still failing, try forcing assemble at gradle level (best-effort)
            DIST_DIR=$(ls -d ./.buildozer/android/platform/build-*/dists/* 2>/dev/null | head -n1 || true)
            if [ -d "$DIST_DIR" ]; then
              (cd "$DIST_DIR" && echo "Attempting gradle assembleRelease in $DIST_DIR" && ./gradlew assembleRelease || ./gradlew assembleRelease --no-daemon) || true
            else
              echo "No dist dir found, can't run gradle fallback."
            fi
          fi
          # show generated files
          echo "Done — listing bin/ and .buildozer/output:"
          ls -la bin || true
          ls -la ./.buildozer || true

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KivyCalculator-release
          path: |
            bin/*.apk
            bin/*.aab
            ./.buildozer/android/platform/build-*/dists/*/bin/*.apk
            ./.buildozer/android/platform/build-*/dists/*/bin/*.aab
            ./.buildozer/android/platform/build-*/dists/*/outputs/**/*.apk