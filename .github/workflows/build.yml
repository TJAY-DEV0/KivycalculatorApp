name: Buildozer Android Release

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on new tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' # Specify your Python version

    - name: Install Buildozer
      run: pip install buildozer

    - name: Create buildozer.spec (if not already present)
      run: buildozer init || true # Initialize if buildozer.spec doesn't exist

    - name: Build Android APK
      run: buildozer android release # or 'release' for a signed release APK
      env:
        # Optional: Set environment variables for Buildozer if needed (e.g., for signing)
        # KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        # KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk # Adjust path if your APK is located elsewhere

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk # Attach the APK to the release
        name: Release ${{ github.ref_name }}
        body: |
          Automated release of ${{ github.ref_name }}
          Built with Buildozer and GitHub Actions.