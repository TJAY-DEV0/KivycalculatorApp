name: Build and Sign Kivy APK (Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-wheel \
            libtool autoconf automake pkg-config \
            unzip zip git openjdk-17-jdk \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Restore keystore from secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Build release APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          buildozer android release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorApp-Release
          path: .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/CalculatorApp/bin/*.apk