name: Build Kivy App (Release)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode Keystore secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > new-release-key.jks

      - name: Build APK (Release)
        uses: mathjazz/buildozer-action@main
        with:
          command: buildozer android release
          workdir: .
          buildozer_version: stable
        env:
          KEYSTORE_PATH: new-release-key.jks
          KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KivyCalculatorApp-release
          path: bin/*.apk