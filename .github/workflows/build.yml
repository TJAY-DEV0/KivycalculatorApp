

name: Build Android Release

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    # Set permissions for GITHUB_TOKEN
    permissions:
      contents: write # Allows writing to the repository to create a release.

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        # Install buildozer and other required tools
        pip install buildozer cython
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf libtool automake
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libgstreamer1.0-dev

    - name: Configure buildozer.spec for signing
      run: |
        # Use sed to inject secret values into buildozer.spec
        # This prevents passwords and aliases from being in the public repository
        sed -i "s|#android.release_keystore =|android.release_keystore = myapp.jks|" buildozer.spec
        sed -i "s|#android.release_keystore_password =|android.release_keystore_password = ${{ secrets.KEYSTORE_PASSWORD }}|" buildozer.spec
        sed -i "s|#android.release_keyalias =|android.release_keyalias = ${{ secrets.KEY_ALIAS }}|" buildozer.spec
        sed -i "s|#android.release_keyalias_password =|android.release_keyalias_password = ${{ secrets.KEY_PASSWORD }}|" buildozer.spec

    - name: Create keystore file from secret
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # Decode the base64 secret and write it to a .jks file
        echo "$ENCODED_KEYSTORE" | base64 --decode > myapp.jks
        
    - name: Build Android AAB
      run: buildozer android release
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app-bundle
        path: bin/*.aab

