jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android release
          # Add the 'workdir' input to explicitly specify the root directory
          workdir: . 
          # Add the 'options' input to run as root user
          options: --user root 
        env:
          # Define your keystore variables here as secrets
          KEYSTORE_PATH: new-release-key.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: bin/*.apk 
