name: Android release
on:
 push:
 branches: [ main ]
 workflow_dispatch:

jobs:
 build-android:
 runs-on: ubuntu-latest
 steps:
 - name: Checkout
 uses: actions/checkout@v4

- name: Restore caches
  uses: actions/cache@v4
  with:
    path: |
      ~/.buildozer
      ~/.local/share/python-for-android
    key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}

- name: Prepare workspace
  run: |
    mkdir -p $HOME/.buildozer $HOME/.local/share/python-for-android

- name: Decode keystore secret
  if: ${{ secrets.KEYSTORE_BASE64 != '' }}
  run: |
    echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release.keystore
    chmod 600 $GITHUB_WORKSPACE/release.keystore

- name: Patch buildozer.spec for release signing
  if: ${{ secrets.KEYSTORE_BASE64 != '' }}
  run: |
    sed -i "s|^#\?\s*android.release_keystore.*|android.release_keystore = ${GITHUB_WORKSPACE}/release.keystore|" buildozer.spec || true
    sed -i "s|^#\?\s*android.release_keyalias.*|android.release_keyalias = ${{ secrets.KEY_ALIAS }}|" buildozer.spec || true
    sed -i "s|^#\?\s*android.release_storepass.*|android.release_storepass = ${{ secrets.KEYSTORE_PASSWORD }}|" buildozer.spec || true
    sed -i "s|^#\?\s*android.release_keypass.*|android.release_keypass = ${{ secrets.KEY_PASSWORD }}|" buildozer.spec || true

- name: Run buildozer (Docker)
  env:
    HOME: /home/runner
  run: |
    docker run --rm \
      -v "${{ github.workspace }}":/home/user/hostcwd \
      -v "${{ runner.home }}/.buildozer":/home/user/.buildozer \
      -v "${{ runner.home }}/.local/share/python-for-android":/home/user/.local/share/python-for-android \
      -w /home/user/hostcwd \
      kivy/buildozer:latest \
      /bin/bash -c "buildozer -v android release"

- name: List produced artifacts
  run: |
    find . -type f -name "*release*.apk" -o -name "*.aab" || true

- name: Upload release artifact
  uses: actions/upload-artifact@v4
  with:
    name: android-release
    path: |
      $(find . -type f -name "*release*.apk" -o -name "*.aab" 2>/dev/null || true)