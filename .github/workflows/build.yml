name: Build and Sign Kivy APK (Release)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-wheel \
            libtool libltdl-dev autoconf automake pkg-config \
            unzip zip git openjdk-17-jdk \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev
          sudo libtoolize --install

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Restore buildozer cache
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/*.py', 'buildozer.spec') }}

      - name: Decode Keystore from Base64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p /home/runner/.keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > /home/runner/.keystore/release-key.jks

      - name: Build release APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          buildozer android release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorApp-Release
          path: .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/CalculatorApp/bin/*.apk