name: Build Kivy Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            autoconf-archive \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            liblzma-dev \
            libffi-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer cython==0.29.34

      - name: Decode Keystore (only for release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Decoding keystore for release build..."
          echo "${{ secrets.ANDROID_KEYSTORE_FILE }}" | base64 --decode > myapp.jks
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}

      - name: Build with Buildozer
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "Starting release build..."
            buildozer android release
          else
            echo "Starting debug build..."
            buildozer android debug
          fi

      # 🆕 Upload built APK(s) to Google Drive
      - name: Upload APK to Google Drive
        uses: Jaimss/github-upload-to-drive@v2
        with:
          target: bin/
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          folderId: 1Ntf_70XPHo64cyVQBdPTWXCnskz9Byw6