name: Build Android Release (Artifact)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Decode Keystore secret to file
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > new-release-key.jks

    - name: Fix permissions
      run: sudo chown -R $USER:$USER .

    - name: Build Release APK
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: buildozer android release
        buildozer_version: stable
        repository_root: .
        workdir: .
      env:
        KEYSTORE_PATH: new-release-key.jks
        KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KivyCalculatorApp-release
        path: ${{ steps.buildozer.outputs.filename }}