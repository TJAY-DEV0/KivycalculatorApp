name: Buildozer Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🧠 Add Swap Memory (for big Buildozer builds)
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: 🏗️ Accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer
          yes | sdkmanager --licenses || true

      - name: 📦 Build Android Release APK
        env:
          KEYSTORE_PATH: new-release-key.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "🔑 Using keystore: $KEYSTORE_PATH"
          buildozer android release

      - name: ☁️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KivyCalculator-Release
          path: bin/*.apk