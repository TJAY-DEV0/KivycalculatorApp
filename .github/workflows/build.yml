name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev liblzma-dev libffi-dev libssl-dev
          
      - name: Install Python requirements
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt || true
          pip3 install buildozer cython pyjnius
        
      - name: Create keystore file from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_FILE }}" | base64 --decode > myapp.jks
        
      - name: Build the Android App Bundle (AAB)
        env:
          android_release_keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          android_release_keyalias_password: ${{ secrets.KEYALIAS_PASSWORD }}
        run: |
          buildozer android release
      
      - name: Upload aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.aab
