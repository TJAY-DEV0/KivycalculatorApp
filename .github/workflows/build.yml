name: Build Kivy App (Release)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Increase swap (for large builds)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip autoconf automake libtool pkg-config zlib1g-dev libffi-dev git
          sudo apt install -y build-essential cmake

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build release APK
        run: |
          buildozer android release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KivyApp-release
          path: .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/**/bin/*.apk